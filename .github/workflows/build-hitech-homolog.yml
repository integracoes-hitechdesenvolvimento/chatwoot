name: Build and publish Chatwoot Auremed homolog image

on:
  push:
    branches:
      - hitech-auremed
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=hitech-auremed
          cache-to: type=gha,mode=max,scope=hitech-auremed
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:hitech-auremed
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Print published image tags
        run: |
          echo "Published:"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:hitech-auremed"
          echo "Digest: ${{ steps.build.outputs.digest }}"
